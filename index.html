  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{--forest:#2e5339;--leaf:#4a7c59;--sage:#8aab8a;--mist:#f0ede4;--cream:#fafaf7;--bark:#2c2c2c;--stone:#888;--border:#e0ddd5;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,0.08);}
    *{box-sizing:border-box;margin:0;padding:0;}
    button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
    html{font-size:16px;overflow-x:hidden;}
    body{background:var(--cream);font-family:'Poppins',sans-serif;color:var(--bark);font-size:1rem;overflow-x:hidden;}
    @media print{.no-print{display:none!important;}.print-card{break-inside:avoid;}body{background:white;}}
    .tip-wrap{position:relative;display:inline-flex;}
    .tip-wrap .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#333;color:white;font-size:11px;padding:5px 9px;border-radius:6px;z-index:400;pointer-events:none;max-width:220px;white-space:normal;text-align:center;line-height:1.4;}
    .tip-wrap:hover .tip{display:block;}
    .plant-removing{opacity:0;transform:translateX(-10px);transition:opacity 0.25s ease,transform 0.25s ease;pointer-events:none;}
    .lb-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.92);flex-direction:column;align-items:center;justify-content:center;}
    .lb-overlay.open{display:flex;}
    /* Search boxes use type="search" (autocomplete="off" alone doesn't
       reliably stop iOS/Chrome from offering saved-password/card/address
       autofill suggestions above the keyboard) -- but that also turns on
       the browser's own round "x" clear button, which would double up with
       the app's existing custom one, so hide the native one. */
    input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;}
    /* Mobile app shell: fixed-height flex column so the bottom nav bar is a
       plain flex item (not position:fixed), which is what actually fixes
       the iOS keyboard-floating bug -- position:fixed is sized against the
       OLD (non-keyboard-aware) layout viewport, but 100dvh (dynamic
       viewport height, supported iOS 15.4+) correctly shrinks when the
       keyboard opens, so a flex item pinned to the bottom of a properly
       dvh-sized shell just naturally stays above the keyboard. The two
       height declarations are a deliberate CSS-cascade fallback -- 100vh
       first for older browsers, then 100dvh overrides it where supported;
       do not collapse these into one line. */
    .app-shell-mobile{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
    .app-scroll-mobile{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}
  </style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
